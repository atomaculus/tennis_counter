org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
# Phone (:mobile). Play requires a unique versionCode per artifact that shares
# applicationId com.playce.tenniscounter.app. Production phone is 19.
PLAYCE_VERSION_CODE=20
PLAYCE_VERSION_NAME=1.2.0
# Wear (:app). Previous Wear upload is 18. Distinct from the phone code so both
# bundles can be uploaded. 21 is the next free code after the phone's 20.
PLAYCE_WEAR_VERSION_CODE=21
