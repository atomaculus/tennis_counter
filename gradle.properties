org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
# Play Console requires a unique versionCode per uploaded artifact.
# Phone and Wear share applicationId, so the codes must differ.
PLAYCE_VERSION_NAME=1.2.0
PLAYCE_MOBILE_VERSION_CODE=20
PLAYCE_WEAR_VERSION_CODE=21
